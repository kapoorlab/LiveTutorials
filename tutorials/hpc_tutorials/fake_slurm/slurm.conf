# slurm.conf — fictional kapoorlabs-fr cluster (for the tutorial's fake Slurm)
ClusterName=kapoorlabs-fr
SlurmctldHost=controller(10.0.0.1)
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
GresTypes=gpu
MaxJobCount=10000
MaxArraySize=1000
DefMemPerCPU=512
MaxMemPerCPU=32768
DefMemPerNode=0
MaxMemPerNode=4096000
TaskPlugin=task/cgroup
PropagateResourceLimits=ALL
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageTRES=cpu,mem,gres/gpu
