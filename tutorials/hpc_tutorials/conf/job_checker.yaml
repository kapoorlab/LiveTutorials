defaults:
  - override hydra/job_logging: none   # no <job>.log files in the run dir

# slurm_job_checker.py configuration (JobCheckerConfig dataclass)
users: [varun, sofie]
hours: 24
output: ""

hydra:
  output_subdir: null   # no .hydra/ sidecar directory
  run:
    dir: .               # run in place, no outputs/ litter
