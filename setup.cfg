[metadata]
name = LiveTutorials

description = Scaffold + dependencies for live LangChain / LLM tutorials
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/KietzmannLab/LiveTutorials
author = Varun Kapoor
author_email = varun.kapoor@uni-osnabrueck.de
license = BSD-3-Clause
license_files = LICENSE
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering :: Image Processing
project_urls =
    Bug Tracker = https://github.com/KietzmannLab/LiveTutorials/issues
    Documentation = https://github.com/KietzmannLab/LiveTutorials#README.md
    Source Code = https://github.com/KietzmannLab/LiveTutorials
    User Support = https://github.com/KietzmannLab/LiveTutorials/issues

[options]
packages = find:
install_requires =
    python-dotenv
    langgraph
    langchain
    openai
    langchain-openai
    langchain-deepseek
    langchain-community
    langchain-chroma
    langchain-ollama
    langchain_huggingface
    langchain-text-splitters
    langchainhub
    pypdf
    requests
    chromadb
    transformers
    sentence-transformers
    streamlit
    watchdog
    bitsandbytes
    InstructorEmbedding
    hydra-core
    # Document conversion with Docling (supports GPU on Mac via MPS)
    docling>=2.0.0


python_requires = >=3.8
include_package_data = True
package_dir =
    =src
setup_requires = setuptools_scm
# add your package requirements here

[options.packages.find]
where = src

[options.entry_points]
kietzmannlab.manifest =
    LiveTutorials = livetutorials:kietzmannlab.yaml

[options.extras_require]
testing =
    tox
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/


[options.package_data]
* = *.yaml
